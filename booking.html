<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Book Charging Slot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="index.html">

                ⚡ EV Charge Finder

            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                            href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="stations.html">
                            Stations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                            href="booking.html">
                            Booking
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Booking -->

    <section class="py-5">

        <div class="container">

            <div class="text-center mb-5">

                <h1 class="fw-bold">
                    Book Your Charging Slot
                </h1>

                <p class="text-muted">
                    Reserve a charging slot easily
                </p>

            </div>


            <div class="row justify-content-center">

                <div class="col-md-7">

                    <div class="card shadow p-4">

                        <form>


                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                    class="form-control"
                                    placeholder="Enter your name">

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                    class="form-control"
                                    placeholder="Enter your email">

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Select Station
                                </label>

                                <select class="form-select">

                                    <option>
                                        GreenCharge - Mumbai
                                    </option>

                                    <option>
                                        PowerGo - Thane
                                    </option>

                                    <option>
                                        EcoVolt - Navi Mumbai
                                    </option>

                                </select>

                            </div>


                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Date
                                    </label>

                                    <input type="date"
                                        class="form-control">

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Time
                                    </label>

                                    <input type="time"
                                        class="form-control">

                                </div>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Vehicle Type
                                </label>

                                <select class="form-select">

                                    <option>
                                        Electric Car
                                    </option>

                                    <option>
                                        Electric Bike
                                    </option>

                                    <option>
                                        Electric Scooter
                                    </option>

                                </select>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Charging Type
                                </label>

                                <select class="form-select">

                                    <option>
                                        AC Charging
                                    </option>

                                    <option>
                                        DC Fast Charging
                                    </option>

                                </select>

                            </div>


                            <button type="submit"
                                class="btn btn-success w-100">

                                Confirm Booking

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer class="bg-dark text-white text-center py-4">

        <h5>⚡ EV Charge Finder</h5>

        <p class="mb-0">
            Find. Charge. Go.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
